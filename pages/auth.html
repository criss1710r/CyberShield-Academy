<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso | CyberShield Academy</title>

    <link rel="stylesheet" href="../CSS/auth.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-header">

                <div class="logo">
                    🛡️
                </div>

                <h1>CyberShield Academy</h1>

                <p>
                    Plataforma de aprendizaje en ciberseguridad
                </p>

            </div>


            <!-- PESTAÑAS -->

            <div class="auth-tabs">

                <button
                    id="loginTab"
                    class="active"
                    onclick="showLogin()">

                    Iniciar sesión

                </button>

                <button
                    id="registerTab"
                    onclick="showRegister()">

                    Registrarse

                </button>

            </div>


            <!-- =========================
                 INICIAR SESIÓN
            ========================== -->

            <form id="loginForm" class="auth-form">

                <h2>Iniciar sesión</h2>

                <label for="loginEmail">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="correo@ejemplo.com"
                    required
                >


                <label for="loginPassword">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="••••••••"
                    required
                >


                <button
                    type="submit"
                    class="auth-button">

                    Iniciar sesión

                </button>

                <p
                    id="loginMessage"
                    class="message">
                </p>

            </form>


            <!-- =========================
                 REGISTRO
            ========================== -->

            <form
                id="registerForm"
                class="auth-form hidden">

                <h2>Crear cuenta</h2>


                <label for="fullName">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Tu Nombre Completo"
                    required
                >


                <label for="username">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Ej:Pedro123"
                    required
                >


                <label for="registerEmail">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="correo@ejemplo.com"
                    required
                >


                <label for="registerPassword">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Mínimo 6 caracteres"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="auth-button">

                    Crear cuenta

                </button>


                <p
                    id="registerMessage"
                    class="message">
                </p>

            </form>


            <a
                href="../index.html"
                class="back-home">

                ← Volver al inicio

            </a>

        </section>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CONFIGURACIÓN -->

    <script src="../js/supabase.js"></script>

    <!-- AUTENTICACIÓN -->

    <script src="../js/auth.js"></script>

</body>

</html>
