<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso | CyberShield Academy</title>

    <link rel="stylesheet" href="../CSS/auth.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-header">

                <div class="logo">
                    🛡️
                </div>

                <h1>CyberShield Academy</h1>

                <p>
                    Plataforma de aprendizaje en ciberseguridad
                </p>

            </div>


            <!-- PESTAÑAS -->

            <div class="auth-buttons">

                <a href="auth.html" class="btn-login">
                Iniciar sesión
                </a>

                <a href="auth.html" class="btn-register">
                Registrarse
                </a>

            </div>


<div class="user-menu">
    <div class="user-profile">
        <div class="user-avatar">
            C
        </div>
        <div class="user-info">
            <span class="user-name">
                Usuario
            </span>
            <span class="user-level">
                Nivel 1
            </span>
            <span class="user-xp">
            0 XP
            </span>
        </div>
    </div>

    <div class="user-dropdown">
        <a href="dashboard.html">
            📊 Mi Dashboard
        </a>
        <a href="#">
            👤 Mi perfil
        </a>
        <a href="#">
            ⚙️ Configuración
        </a>
        <button onclick="logoutUser()">
            🚪 Cerrar sesión
        </button>
    </div>
</div>


            <!-- =========================
                 INICIAR SESIÓN
            ========================== -->

            <form id="loginForm" class="auth-form">

                <h2>Iniciar sesión</h2>

                <label for="loginEmail">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="correo@ejemplo.com"
                    required
                >


                <label for="loginPassword">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="••••••••"
                    required
                >


                <button
                    type="submit"
                    class="auth-button">

                    Iniciar sesión

                </button>

                <p
                    id="loginMessage"
                    class="message">
                </p>

            </form>


            <!-- =========================
                 REGISTRO
            ========================== -->

            <form
                id="registerForm"
                class="auth-form hidden">

                <h2>Crear cuenta</h2>


                <label for="fullName">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Tu Nombre Completo"
                    required
                >


                <label for="username">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Ej:Pedro123"
                    required
                >


                <label for="registerEmail">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="correo@ejemplo.com"
                    required
                >


                <label for="registerPassword">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Mínimo 6 caracteres"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="auth-button">

                    Crear cuenta

                </button>


                <p
                    id="registerMessage"
                    class="message">
                </p>

            </form>


            <a
                href="../index.html"
                class="back-home">

                ← Volver al inicio

            </a>

        </section>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CONFIGURACIÓN -->

    <script src="../js/supabase.js"></script>

    <!-- AUTENTICACIÓN -->

    <script src="../js/auth.js"></script>

</body>

</html>
